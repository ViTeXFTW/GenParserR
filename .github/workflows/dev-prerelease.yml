# Publishes Marketplace pre-release builds from the dev branch after CI passes
# and the workspace version changes.

name: Dev Pre-release

on:
  workflow_run:
    workflows: ["CI"]
    branches: [dev]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BIN_NAME: zerosyntax-lsp
  CARGO_TERM_COLOR: always

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        if: github.event_name == 'workflow_run'
        with:
          name: dev-prerelease-context
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: prerelease-context
      - name: Check version change
        id: version
        run: |
          read_version() {
            awk '
              /^\[workspace.package\]$/ { in_workspace_package = 1; next }
              /^\[/ { in_workspace_package = 0 }
              in_workspace_package && $1 == "version" {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            '
          }

          current="$(read_version < Cargo.toml)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Manual pre-release for $current."
            exit 0
          fi

          before="$(cat prerelease-context/before)"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            previous=""
          else
            previous="$(git show "$before:Cargo.toml" | read_version)"
          fi
          if [ "$current" = "$previous" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged ($current); skipping pre-release."
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Version changed $previous -> $current; publishing pre-release."

  build:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: prerelease-${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release -p zerosyntax-server --target ${{ matrix.target }}
      - name: Stage binary (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir bin
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" bin/
      - name: Stage binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path bin | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN_NAME.exe" bin
      - uses: actions/upload-artifact@v4
        with:
          name: prerelease-bin-${{ matrix.target }}
          path: bin/*
          if-no-files-found: error

  vsix:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vsce-target: win32-x64
            rust-target: x86_64-pc-windows-msvc
          - vsce-target: linux-x64
            rust-target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: prerelease-bin-${{ matrix.rust-target }}
          path: editors/vscode/server
      - name: Read version
        id: version
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "zerosyntax-server") | .version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package pre-release extension
        working-directory: editors/vscode
        run: |
          chmod +x server/${BIN_NAME}* || true
          [ -f ../../LICENSE ] && cp ../../LICENSE .
          npm ci
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npx --yes @vscode/vsce package --pre-release --target ${{ matrix.vsce-target }} \
            -o "zerosyntax-vscode-${{ matrix.vsce-target }}-${{ steps.version.outputs.version }}-pre.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: prerelease-vsix-${{ matrix.vsce-target }}
          path: editors/vscode/*.vsix
          if-no-files-found: error

  publish-marketplace-prerelease:
    needs: vsix
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Check token
        id: token
        run: |
          if [ -n "$VSCE_PAT" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install VS Code packaging tool
        if: steps.token.outputs.present == 'true'
        working-directory: editors/vscode
        run: npm ci
      - uses: actions/download-artifact@v8
        if: steps.token.outputs.present == 'true'
        with:
          pattern: prerelease-vsix-*
          path: vsix
          merge-multiple: true
      - name: Publish pre-release to VS Code Marketplace
        if: steps.token.outputs.present == 'true'
        run: |
          for f in vsix/*.vsix; do
            editors/vscode/node_modules/.bin/vsce publish --packagePath "$f" --pat "$VSCE_PAT"
          done
