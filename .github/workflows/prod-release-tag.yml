# Creates the live release tag when dev is merged into prod, then calls the
# reusable release workflow directly. Tags pushed with GITHUB_TOKEN do not start
# another workflow run, so calling release.yml here avoids needing another PAT.

name: Prod Release Tag

on:
  push:
    branches: [prod]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.tag.outputs.created }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        id: version
        run: |
          version="$(awk '
            /^\[workspace.package\]$/ { in_workspace_package = 1; next }
            /^\[/ { in_workspace_package = 0 }
            in_workspace_package && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::could not read [workspace.package].version from Cargo.toml" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Create release tag
        id: tag
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "$tag already exists; skipping release."
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write
