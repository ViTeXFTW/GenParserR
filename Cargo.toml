[workspace]
resolver = "2"
members = [
    "crates/schema",
    "crates/syntax",
    "crates/analysis",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/your-org/genparser"
rust-version = "1.75"

[workspace.dependencies]
genparser-schema = { path = "crates/schema" }
genparser-syntax = { path = "crates/syntax" }
genparser-analysis = { path = "crates/analysis" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# syntax
logos = "0.15"
rowan = "0.16"

# server
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
ropey = "1"
dashmap = "6"

# server (workspace indexing)
walkdir = "2"

# benches
criterion = "0.5"
