[workspace]
resolver = "2"
members = ["crates/schema", "crates/syntax", "crates/analysis", "crates/server"]

[workspace.package]
version = "1.0.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/ViTeXFTW/ZeroSyntaxV2"
rust-version = "1.75"

[workspace.dependencies]
zerosyntax-schema = { path = "crates/schema" }
zerosyntax-syntax = { path = "crates/syntax" }
zerosyntax-analysis = { path = "crates/analysis" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# syntax
logos = "0.16"
rowan = "0.16"

# server
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
ropey = "1"
dashmap = "6"

# server (workspace indexing)
walkdir = "2"

# benches
criterion = "0.8"
