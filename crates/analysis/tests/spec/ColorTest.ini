; Color values follow INI.cpp parseRGBColor / parseColorInt:
; `R:<int> G:<int> B:<int> [A:<int>]`, components 0-255, tags in order
; (case-insensitive), `:` is a separator so `R: 255` is also legal.

; Valid: plain, with alpha, spaced colon, lowercase tags.
MultiplayerColor StructureGood
    TooltipName = Color:Good
    RGBColor = R:255 G:0 B:64
    RGBNightColor = r:12 g: 200 B:0 A:128
End

; `Q:` is not a valid component tag.
MultiplayerColor StructureBadTag
    RGBColor = Q:255 G:0 B:0
End

; 999 is out of the 0-255 range.
MultiplayerColor StructureBadRange
    RGBColor = R:999 G:0 B:0
End

; The blue component is missing entirely.
MultiplayerColor StructureMissing
    RGBColor = R:1 G:2
End

; Colors validate inside sub-block scopes too (FXList Tracer nugget).
FXList FX_ColorTest
    Tracer
        Color = R:0 G:0 B:bad
        Speed = 100.0
    End
End
