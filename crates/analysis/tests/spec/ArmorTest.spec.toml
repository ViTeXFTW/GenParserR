# Expected behavior for ArmorTest.ini.
#
# The `Armor` field is a `token_list` (`<DamageType|Default> <percent>`,
# Armor.cpp parseArmorCoefficients): each token validates against its own
# element type, and value completion offers the damage-type members.

# `test` should be rejected as an unknown armor damage-type.
[[diag]]
severity = "error"
code = "bad-enum"
on = "test"

# `2` should be rejected: the second token must be a percentage.
[[diag]]
severity = "error"
code = "bad-percent"
on = "2"

# `asd` is not a field the Armor block declares. Engine-faithful: a warning.
[[diag]]
severity = "warning"
code = "unknown-field"
on = "asd"

# Empty field-key line -> offer the block's field names.
[[complete]]
at = "$1"
includes = ["Armor"]

# After `Armor =` -> offer armor damage-type values.
[[complete]]
at = "$2"
includes = ["ARMOR_PIERCING"]
