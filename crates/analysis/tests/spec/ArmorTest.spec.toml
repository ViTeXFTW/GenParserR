# Expected behavior for ArmorTest.ini.
#
# The `Armor` field is currently typed `ascii_string_list`, so per-token enum /
# percentage validation and value completion are not produced yet — those
# assertions are marked `xfail` and document the intended behavior.

# `test` should be rejected as an unknown armor damage-type.
[[diag]]
severity = "error"
code = "bad-enum"
on = "test"
xfail = true

# `2` should be rejected: the second token must be a percentage.
[[diag]]
severity = "error"
code = "bad-percent"
on = "2"
xfail = true

# `asd` is not a field the Armor block declares. Engine-faithful: a warning.
[[diag]]
severity = "warning"
code = "unknown-field"
on = "asd"

# Empty field-key line -> offer the block's field names.
[[complete]]
at = "$1"
includes = ["Armor"]

# After `Armor =` -> offer armor damage-type values (not yet modeled).
[[complete]]
at = "$2"
includes = ["ARMOR_PIERCING"]
xfail = true
