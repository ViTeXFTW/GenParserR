; Block-local dead-code: a WeaponSet/ArmorSet conditioned on PLAYER_UPGRADE
; can only ever be selected if a module on the same object sets that flag
; (WeaponSetUpgrade / the TransportContain family; ArmorUpgrade for armor).

; Reachable: the WeaponSetUpgrade module makes the upgrade set selectable.
Object DeadCodeOkTank
  WeaponSet
    Conditions = None
    Weapon = PRIMARY DeadCodeTestGun
  End
  WeaponSet
    Conditions = PLAYER_UPGRADE
    Weapon = PRIMARY DeadCodeTestGun
  End
  Behavior = WeaponSetUpgrade ModuleTag_01
    TriggeredBy = Upgrade_DeadCodeTest
  End
End

; Unreachable: no module on this object can set PLAYER_UPGRADE.
Object DeadCodeBadTank
  WeaponSet
    Conditions = None
    Weapon = PRIMARY DeadCodeTestGun
  End
  WeaponSet
    Conditions = PLAYER_UPGRADE
    Weapon = PRIMARY DeadCodeTestGun
  End
  ArmorSet
    Conditions = PLAYER_UPGRADE
    Armor = DeadCodeTestArmor
  End
End

; A transport sets WEAPONSET_PLAYER_UPGRADE itself when riders can fire
; (TransportContain.cpp), so this is reachable without a WeaponSetUpgrade.
Object DeadCodeTransport
  WeaponSet
    Conditions = PLAYER_UPGRADE
    Weapon = PRIMARY DeadCodeTestGun
  End
  Behavior = TransportContain ModuleTag_02
    Slots = 4
  End
End

; map.ini-style override patches are partial definitions: never flagged.
Object DeadCodeOverride
  RemoveModule ModuleTag_99
  WeaponSet
    Conditions = PLAYER_UPGRADE
    Weapon = PRIMARY DeadCodeTestGun
  End
End

; SET_NORMAL_UPGRADED is selected only after LocomotorSetUpgrade calls
; setLocomotorUpgrade(true). Without that module, this field is dead.
Object DeadCodeBadLocomotor
  Locomotor = SET_NORMAL DeadCodeNormalLocomotor
  Locomotor = SET_NORMAL_UPGRADED DeadCodeUpgradedLocomotor
  Behavior = AIUpdateInterface ModuleTag_AI
  End
End

Object DeadCodeGoodLocomotor
  Locomotor = SET_NORMAL DeadCodeNormalLocomotor
  Locomotor = SET_NORMAL_UPGRADED DeadCodeUpgradedLocomotor
  Behavior = AIUpdateInterface ModuleTag_AI
  End
  Behavior = LocomotorSetUpgrade ModuleTag_LocomotorUpgrade
    TriggeredBy = Upgrade_DeadCodeTest
  End
End

; map.ini-style override patches may inherit LocomotorSetUpgrade: never flagged.
Object DeadCodeLocomotorOverride
  RemoveModule ModuleTag_99
  Locomotor = SET_NORMAL_UPGRADED DeadCodeUpgradedLocomotor
End

Weapon DeadCodeTestGun
  PrimaryDamage = 10.0
End

Armor DeadCodeTestArmor
  Armor = Default 100%
End

Upgrade Upgrade_DeadCodeTest
  BuildTime = 1.0
End

Locomotor DeadCodeNormalLocomotor
End

Locomotor DeadCodeUpgradedLocomotor
End
