; `AddModule`/`ReplaceModule` re-enter the *full* Object field table
; (ThingTemplate::parseAddModule calls initFromINI(self, getFieldParse())),
; so any Object child is legal inside the wrapper — including sub-blocks like
; UnitSpecificSounds, not just module slots. Their `End`s must close the right
; scopes so the Object fields *after* the wrapper stay fields (the bug: the
; wrapper closed early, its final `End` closed the Object, and `Scale` was
; parsed as an unknown top-level block).

Object CINE_ScudStormMissileChassis
  AddModule
    UnitSpecificSounds
      TurretMoveStart = NoSound
    End
    Body = StructureBody ModuleTagNew_01
      MaxHealth = 500
    End
    Behavior = DestroyDie ModuleTagNew_02
    End
  End

  Scale               = 2.7
  VisionRange         = 200

  RemoveModule ModuleTag_DefaultDestroyDie
End
