; Module enum/bitflag value sets (Phase 5 batch 3): ObjectStatus, DeathType,
; veterancy and ModelCondition flag lists validate their members (incl. the
; engine's ALL/NONE and +/- prefix forms), and parseIndexList enums
; (Locomotor Appearance, MaxHealthUpgrade ChangeType, ...) validate and
; complete from their engine name arrays.

Object TestStatusTank
  Behavior = StatusBitsUpgrade ModuleTag_01
    TriggeredBy = Upgrade_ValueSetTest
    StatusToSet = CAN_ATTACK WET
    StatusToClear = NOT_A_STATUS
  End
  Behavior = SlowDeathBehavior ModuleTag_02
    DeathTypes = ALL -CRUSHED +EXPLODED
    VeterancyLevels = NONE +ELITE +HEROIC
  End
  Behavior = MaxHealthUpgrade ModuleTag_03
    TriggeredBy = Upgrade_ValueSetTest
    AddMaxHealth = 100.0
    ChangeType = $1
  End
End

Upgrade Upgrade_ValueSetTest
  BuildTime = 1.0
End

Locomotor TestLoco
  Speed = 30
  Appearance = TREADS
  ZAxisBehavior = SEA_LEVEL
  GroupMovementPriority = MOVES_NEVER
End
