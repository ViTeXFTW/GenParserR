; Duration fields (INI.cpp parseDurationUnsignedInt / parseDurationReal) take
; a number of milliseconds. Weapon.ClipReloadTime is one such field.

Weapon DurationBad
    ClipReloadTime = soon
End

; Percent fields require the `%` sign (stricter than the engine, which reads
; a bare real - `Armor = X 2` almost never means 2 percent).
Armor DurationPercentBad
    Armor = ARMOR_PIERCING 2.5
End
