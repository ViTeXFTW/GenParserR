; Two Behavior modules sharing the same ModuleTag — the engine cannot remove
; a module by tag if duplicates exist (ThingTemplate.cpp).
Object WithDuplicateTags
    Behavior = PhysicsBehavior ModuleTag_01
    End
    Behavior = PhysicsBehavior ModuleTag_01
    End
End

; Distinct tags — no warning expected.
Object WithDistinctTags
    Behavior = PhysicsBehavior ModuleTag_01
    End
    Behavior = PhysicsBehavior ModuleTag_02
    End
End
