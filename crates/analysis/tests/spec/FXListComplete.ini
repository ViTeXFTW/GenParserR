; Completions inside an FXList body should offer declared sub-block keywords
; (ParticleSystem, Sound, Tracer, ...) because FXList has no fields, only
; sub-blocks.
FXList FX_Test
    $1
End

; Inside a ParticleSystem nugget, the nugget's own fields should be offered.
FXList FX_Test2
    ParticleSystem
        $2
    End
End
