; Reference-typed fields complete from the workspace index and flag
; unresolved names: images (ButtonImage), FX lists, audio events, and
; CommandSet's numbered command-button slots.

MappedImage TestButtonImage
  Texture = SomeTexture.tga
End

AudioEvent TestFireSound
  Volume = 60.0
End

FXList FX_TestFire
End

CommandButton Command_RefTest
  ButtonImage = TestButtonImage
End

Object RefTestObject
  ButtonImage = $1
  SelectPortrait = NoSuchImage
  Behavior = RiderChangeContain ModuleTag_Riders
    Rider1 = $5 RIDER1 WEAPON_RIDER1 STATUS_RIDER1 RefTestCommandSet SET_NORMAL
    Rider2 = RefTestObject $6 WEAPON_RIDER1 STATUS_RIDER1 RefTestCommandSet SET_NORMAL
    Rider3 = RefTestObject RIDER1 $7 STATUS_RIDER1 RefTestCommandSet SET_NORMAL
    Rider4 = RefTestObject RIDER1 WEAPON_RIDER1 $8 RefTestCommandSet SET_NORMAL
    Rider5 = RefTestObject RIDER1 WEAPON_RIDER1 STATUS_RIDER1 $9 SET_NORMAL
    Rider6 = RefTestObject RIDER1 WEAPON_RIDER1 STATUS_RIDER1 RefTestCommandSet $10
    Rider7 = NoSuchRiderObject RIDER1 WEAPON_RIDER1 STATUS_RIDER1 NoSuchCommandSet SET_NORMAL
  End
End

Weapon RefTestWeapon
  FireFX = $2
  FireSound = $3
End

CommandSet RefTestCommandSet
  1 = $4
End
