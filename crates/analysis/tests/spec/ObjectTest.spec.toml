# Expected behavior for ObjectTest.ini.
#
# Reference resolution, draw-module completion, the module-tag /
# WeaponSet-condition warnings, and weapon-slot completion (WeaponSet's
# `Weapon` field is a `token_list` of `<slot> <weapon>`).

# Undefined upgrade reference -> unresolved (a stricter, modder-helpful warning).
[[diag]]
severity = "warning"
code = "unresolved-reference"
on = "unkonwnUpgrade"

# Missing ModuleTag after a module name is flagged (ThingTemplate.cpp:
# "there must be a module tag present, and it must be unique").
[[diag]]
severity = "warning"
code = "missing-module-tag"
on = "W3DModelDraw"

# A WeaponSet without a Conditions field silently becomes the default set.
[[diag]]
severity = "warning"
code = "missing-condition"
on = "WeaponSet"

# After `Draw =` -> offer draw modules only; Body/Behavior modules excluded.
[[complete]]
at = "$1"
includes = ["W3DModelDraw"]
excludes = ["ActiveBody", "PhysicsBehavior"]

# After `Weapon =` inside a WeaponSet -> offer the weapon slot enums.
[[complete]]
at = "$2"
includes = ["PRIMARY", "SECONDARY", "TERTIARY"]

# Blank line inside a Draw module body -> offer module fields, not module names.
[[complete]]
at = "$3"
includes = ["OkToChangeModelColor"]
excludes = ["ActiveBody", "W3DModelDraw"]

# ActiveBody in a Draw slot -> engine crash -> error.
[[diag]]
severity = "error"
code = "module-wrong-slot"
on = "ActiveBody"
