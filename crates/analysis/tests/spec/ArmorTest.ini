; Valid: every entry is a well-formed <DamageType> <Percent> pair.
Armor TankArmor
    Armor = ARMOR_PIERCING 100%
End

; `test` is not a valid armor damage-type.
Armor TestArmor
    Armor = test 100%
End

; `2` is not a percentage.
Armor TestArmor2
    Armor = ARMOR_PIERCING 2
End

; `asd` is not a valid field for an Armor block.
Armor TestArmor3
    asd = fasdf asdf
End

; Completion at field-key position should offer the Armor field.
Armor TestArmor4
    $1
End

; Completion after `Armor =` should offer armor damage-type values.
Armor TestArmor5
    Armor = $2
End
