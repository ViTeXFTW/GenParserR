; Override-layer semantics: this file is named map.ini, so the engine loads
; it with INI_LOAD_CREATE_OVERRIDES — a block redefining an existing name is
; merged over a *copy* of that definition (ThingFactory::newOverride),
; inheriting its modules. The redefinition gets an `overrides` hint, and the
; block-local PLAYER_UPGRADE reachability check stays silent (the trigger
; module may live on the inherited definition). The base definition normally
; lives in the shipped game data; in this single-file spec workspace it is
; the first block.

; Single-file stand-in for Data/INI/Default/Object.ini.
Object DefaultThingTemplate
  Behavior = DestroyDie ModuleTag_DefaultDestroyDie
  End
End

Object NewMapObject
End

Object CINE_RangerPatch
  Behavior = WeaponSetUpgrade ModuleTag_Flash
    TriggeredBy = Upgrade_Veterancy_ELITE
  End
End

Object CINE_RangerPatch
  RemoveModule $1
  WeaponSet
    Conditions = None
    Weapon     = PRIMARY DefaultRangerCombatRifle
  End
  WeaponSet
    Conditions = PLAYER_UPGRADE
    Weapon     = SECONDARY RangerFlashBangGrenadeWeapon
  End

  VisionRange = 150
End

CommandSet MapBadSet
  1 = Command_ConstructMapTank
End

Object MapTank
  CommandSet = MapLateSet
  WeaponSet
    Conditions = None
    Weapon = PRIMARY MapTankGun
  End
End

CommandButton Command_ConstructMapTank
  Command = UNIT_BUILD
  Object = MapTank
End

CommandSet MapLateSet
  1 = Command_ConstructMapTank
End

Weapon MapTankGun
  PrimaryDamage = 1.0
End

CommandButton Command_Ordered
  Command = UNIT_BUILD
End

CommandSet OrderedSet
  1 = Command_Ordered
End

Object MapProjectile
End

Weapon MapProjectileWeapon
  ProjectileObject = MapProjectile
End

Object PrereqConsumer
  Prerequisites
    Object = LatePrereq
  End
End

Object LatePrereq
End

Object PortraitConsumer
  SelectPortrait = LatePortrait
End

MappedImage LatePortrait
End

ObjectReskin ReskinChild ReskinParent
End

Object ReskinParent
End

PlayerTemplate LateBoundPlayer
  PurchaseScienceCommandSetRank1 = LatePlayerSet
End

CommandSet LatePlayerSet
End

ObjectCreationList LateBoundOCL
  CreateObject
    ObjectNames = LateOCLObject
  End
End

Object LateOCLObject
End

ParticleSystem LateBoundParticle
  SlaveSystem = LateSlaveParticle
End

ParticleSystem LateSlaveParticle
End

Object LateAudioConsumer
  VoiceSelect = LateAudioEvent
End

AudioEvent LateAudioEvent
End

Object LateUpgradeConsumer
  Behavior = WeaponSetUpgrade ModuleTag_LateStoredUpgrade
    TriggeredBy = LateStoredUpgrade
  End
End

Upgrade LateStoredUpgrade
End
