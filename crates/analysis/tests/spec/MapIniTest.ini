; map.ini override syntax (ThingTemplate.cpp parseAddModule / parseRemoveModule
; / parseReplaceModule): maps ship INI files that alter existing object
; definitions. `AddModule`/`ReplaceModule <tag>` open End-terminated scopes
; re-entering the Object table; `RemoveModule <tag>` is a single line.

Object AmericaVehicleHumvee
  RemoveModule ModuleTag_05
  AddModule
    Behavior = AutoHealBehavior ModuleTag_MapHeal
      HealingAmount = 5
      TriggeredBy = $1
    End
  End
  ReplaceModule ModuleTag_03
    Behavior = PhysicsBehavior ModuleTag_MapPhysics
      Mass = 40.0
    End
  End
End

Upgrade Upgrade_MapSpecial
  BuildTime = 1.0
End
