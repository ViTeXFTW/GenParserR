; Phase 2 structural coverage: schema sub-blocks (FXList / OCL nuggets,
; EvaEvent SideSounds, Object Prerequisites + wrappers), decal scopes inside
; Behavior modules, ObjectReskin's full Object body, and single-line
; directive blocks. None of this may produce syntax / unknown-block errors.
;
; Phase 5 additions pin the context-keyed disambiguation of keywords that are
; a scope in one place and a field in another: `Turret` is a scope under an
; AIUpdate Behavior but a field inside a ConditionState; `UnitSpecificSound`
; is always a field (Upgrade/CommandButton); UnitSpecificSounds/FX are Object
; scopes.

FXList FX_StructureTest
  ParticleSystem
    Name = ToxicShellExplosion
  End
  Sound
    Name = CarMount
  End
  ViewShake
    Type = STRONG
  End
End

ObjectCreationList OCL_StructureTest
  CreateObject
    ObjectNames = FireFieldSmall
    Disposition = ON_GROUND_ALIGNED
  End
  DeliverPayload
    Transport = AmericaJetA10Thunderbolt
    DeliveryDecal
      Texture = SCCNuclearMissile_China
    End
  End
End

EvaEvent StructureTestLowPower
  Priority = 200
  SideSounds
    Side = America
    Sounds = EVA_LowPower
  End
End

Object StructureTestTank
  Prerequisites
    Object = StructureTestWarFactory
  End
  InheritableModule
    Behavior = AutoHealBehavior ModuleTag_IM
      HealingAmount = 10
    End
  End
  UnitSpecificFX
    CombatDropKillFX = FX_RangerCombatDropKill
  End
  Behavior = NeutronMissileUpdate ModuleTag_NM
    DeliveryDecal
      Texture = SCCNuclearMissile_China
    End
  End
End

ObjectReskin StructureTestTankRed StructureTestTank
  Draw = W3DModelDraw ModuleTag_01
    ConditionState = NONE
      Model = UBHole
    End
  End
End

BenchProfile = P4 2189 6.108187 15.113676 9.402223
ReallyLowMHz = 600
LODPreset = LOW P3 1400 GF3 128

Object StructureTestTurretTank
  Draw = W3DTankDraw ModuleTag_Draw
    ConditionState = NONE
      Model = NVHvyTank
      Turret = Turret01
    End
  End
  Behavior = AIUpdateInterface ModuleTag_AI
    Turret
      TurretTurnRate = 60.0
      ControlledWeaponSlots = PRIMARY SECONDARY
    End
    AltTurret
      TurretTurnRate = 90.0
    End
    AutoAcquireEnemiesWhenIdle = Yes
  End
  UnitSpecificSounds
    VoiceCrush = NoSound
  End
End

Upgrade StructureTestUpgrade
  BuildTime = 5.0
  UnitSpecificSound = SomeUpgradeSound
End
