; Typing a partial block keyword at file scope should offer block completions
; so the popup appears without needing Ctrl+Space.
; The marker sits at the end of the partial word; after strip it reads `FXLi`.
FXLi$1
End

; The second marker is inside the block-name position (after `Object `).
; Block keywords must NOT be offered there — only field/module completions apply.
Object $2
End
