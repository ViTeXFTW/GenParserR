; Coordinate values follow INI.cpp parseCoord2D: `X:<real> Y:<real>`,
; tags in order, case-insensitive, `:` is a separator.
; Weapon.ScatterTarget dispatches to parseCoord2D (Weapon.cpp).

; `Q:` is not a coordinate axis here.
Weapon CoordBadTag
    ScatterTarget = X:1 Q:2
End

; `abc` is not a number.
Weapon CoordBadNumber
    ScatterTarget = X:abc Y:0
End

; The Y axis is missing.
Weapon CoordMissing
    ScatterTarget = X:5
End
