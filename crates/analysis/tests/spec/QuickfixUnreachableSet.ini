; Quickfix test: unreachable-set actions.

; QFBadTank: WeaponSet and ArmorSet conditioned on PLAYER_UPGRADE but no trigger.
Object QFBadTank
  WeaponSet
    Conditions = PLAYER_UPGRADE
    Weapon = PRIMARY QFGun
  End
  ArmorSet
    Conditions = PLAYER_UPGRADE
    Armor = QFArmor
  End
End

; QFGoodTank: has WeaponSetUpgrade so the PLAYER_UPGRADE WeaponSet is reachable.
Object QFGoodTank
  WeaponSet
    Conditions = PLAYER_UPGRADE
    Weapon = PRIMARY QFGun
  End
  Behavior = WeaponSetUpgrade ModuleTag_01
    TriggeredBy = Upgrade_QFTest
  End
End

Weapon QFGun
  PrimaryDamage = 10.0
End

Armor QFArmor
  Armor = Default 100%
End

Upgrade Upgrade_QFTest
  BuildTime = 1.0
End
