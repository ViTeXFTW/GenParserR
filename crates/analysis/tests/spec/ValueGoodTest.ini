; Well-formed values for every Phase-4 validator: none of this may produce an
; error. (Warnings are allowed; `no_errors` only gates error severity.)

; Colors: plain, with alpha, spaced colon, lowercase tags.
MultiplayerColor ValueGood
    TooltipName = Color:ValueGood
    RGBColor = R:255 G:0 B:64
    RGBNightColor = r:12 g: 200 B:0 A:128
End

; Coord2D, duration, and a negative real coordinate.
Weapon ValueGoodWeapon
    ScatterTarget = X:10 Y:-20.5
    ScatterTarget = X:0 Y:0
    ClipReloadTime = 3000
End

; Armor coefficients: `<DamageType|Default> <percent>`.
Armor ValueGoodArmor
    Armor = Default 100%
    Armor = ARMOR_PIERCING 50%
    Armor = EXPLOSION -25%
End

; WeaponSet / ArmorSet with engine-faithful fields; Tracer nugget color.
Object ValueGoodObject
    WeaponSet
        Conditions = None
        Weapon = PRIMARY ValueGoodRealWeapon
        ShareWeaponReloadTime = Yes
    End
    WeaponSet
        Conditions = PLAYER_UPGRADE
        Weapon = SECONDARY ValueGoodRealWeapon
    End
    ArmorSet
        Conditions = VETERAN ELITE
        Armor = ValueGoodRealArmor
    End
End

Weapon ValueGoodRealWeapon
    PrimaryDamage = 10.0
End

Armor ValueGoodRealArmor
    Armor = Default 100%
End

FXList FX_ValueGood
    Tracer
        Color = R:0 G:255 B:0
        Speed = 100.0
        Probability = 0.5
    End
End
